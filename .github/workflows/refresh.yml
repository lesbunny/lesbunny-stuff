name: lesbunny-stuff auto-updater

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-source
  cancel-in-progress: false

jobs:
  refresh:
    name: Build and publish lesbunny patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest upstream development branch
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="$(printf '%s' 'aHR0cHM6Ly9hcGkuZ2l0aHViLmNvbS9yZXBvcy9WZW51c0lzSmFkZWQvVmVudXMtUGF0Y2hlcy9wdWxscz9zdGF0ZT1vcGVuJnBlcl9wYWdlPTEwMA==' | base64 -d)"
          OWNER="$(printf '%s' 'VmVudXNJc0phZGVk' | base64 -d)"
          REPO="$(printf '%s' 'VmVudXMtUGF0Y2hlcw==' | base64 -d)"
          PR_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "$API_URL")"
          PR="$(jq -cer --arg owner "$OWNER" --arg repo "$REPO" '[.[] | select(.user.login == $owner and .head.repo.full_name == ($owner + "/" + $repo))] | sort_by(.updated_at) | last' <<<"$PR_JSON" || true)"
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            BRANCH="$(jq -r '.head.ref' <<<"$PR")"
            SHA="$(jq -r '.head.sha' <<<"$PR")"
            PR_NUMBER="$(jq -r '.number' <<<"$PR")"
          else
            BRANCH="main"
            SHA="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$OWNER/$REPO/branches/main" | jq -r '.commit.sha')"
            PR_NUMBER="none"
          fi
          {
            echo "owner=$OWNER"
            echo "repo=$REPO"
            echo "branch=$BRANCH"
            echo "sha=$SHA"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Mirror upstream source
        shell: bash
        env:
          UPSTREAM_OWNER: ${{ steps.upstream.outputs.owner }}
          UPSTREAM_REPO: ${{ steps.upstream.outputs.repo }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --depth 1 --single-branch --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git" "$TMP/source"
          ACTUAL_SHA="$(git -C "$TMP/source" rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$UPSTREAM_SHA"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/refresh.yml' \
            "$TMP/source/" "$GITHUB_WORKSPACE/"

      - name: Remove public documentation and preserve legal notices
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          find . -type f -iname '*.md' -not -path './.git/*' -delete
          rm -f .github/workflows/build.yml
          rm -rf .github/ISSUE_TEMPLATE .github/dependabot.yml
          mkdir -p .github/workflows
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          notice = Path("NOTICE")
          original = notice.read_text(encoding="utf-8") if notice.exists() else ""
          marker = "Modified work notice"
          if not original.startswith(marker):
              header = (
                  "Modified work notice\n"
                  f"Modified by lesbunny on {datetime.now(timezone.utc).date().isoformat()} (UTC). "
                  "This is a modified version; upstream copyright and third-party attribution notices are retained below.\n\n"
              )
              notice.write_text(header + original, encoding="utf-8")
          PY

      - name: Rebrand visible labels and bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          upstream_brand = bytes([86, 101, 110, 117, 115]).decode("ascii")
          targets = []
          targets += list(Path("patches/src/main/resources/venus").glob("bootstrap.js"))
          targets += list(Path("patches/src/main/resources/venus/i18n").glob("*.json"))
          targets += list(Path("patches/src/main/kotlin").rglob("*.kt"))
          for path in targets:
              text = path.read_text(encoding="utf-8")
              text = re.sub(rf"\b{re.escape(upstream_brand)}\b", "lesbunny", text)
              text = text.replace("com.discord.venus", "com.discord.lesbunny")
              path.write_text(text, encoding="utf-8")

          bootstrap = Path("patches/src/main/resources/venus/bootstrap.js")
          text = bootstrap.read_text(encoding="utf-8")
          text, count = re.subn(
              r'const REPO = "[^"]+";',
              'const REPO = "https://github.com/lesbunny/lesbunny-stuff";',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not rebrand the About-menu repository URL")
          text = text.replace('DEBUG_LOG_FILE = "venus-log.txt"', 'DEBUG_LOG_FILE = "lesbunny-log.txt"')
          text = re.sub(r'(dlog\("[A-Z]",\s*)"venus"(?=\s*,)', r'\1"lesbunny"', text)
          text = text.replace('" I [venus] Debug logging off"', '" I [lesbunny] Debug logging off"')
          text = text.replace('"venus-logs-"', '"lesbunny-logs-"')
          text = text.replace('"venus-backup-"', '"lesbunny-backup-"')
          bootstrap.write_text(text, encoding="utf-8")

          for path in Path("scripts").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(rf"\b{re.escape(upstream_brand)}\b", "lesbunny", text)
              path.write_text(text, encoding="utf-8")
          cli = Path("scripts/morphe_cli.py")
          text = cli.read_text(encoding="utf-8").replace('"User-Agent": "venus-patches"', '"User-Agent": "lesbunny-patches"')
          cli.write_text(text, encoding="utf-8")

          for language_file in Path("patches/src/main/resources/venus/i18n").glob("*.json"):
              data = json.loads(language_file.read_text(encoding="utf-8"))
              strings = data.get("strings")
              if isinstance(strings, dict):
                  strings.setdefault("lesbunny", "lesbunny")
                  language_file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          build = Path("scripts/build.py")
          text = build.read_text(encoding="utf-8")
          text = re.sub(r'Name: [^"]+', "Name: lesbunny-stuff", text)
          text = re.sub(r'Description: [^"]+', "Description: Morphe patch bundle.", text)
          text = re.sub(r'Source: https://github\.com/[^"]+', "Source: https://github.com/lesbunny/lesbunny-stuff", text)
          text = re.sub(r'Author: [^"]+', "Author: lesbunny", text)
          build.write_text(text, encoding="utf-8")

          notes = Path("scripts/release_notes.py")
          text = notes.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^REPO\s*=\s*"[^"]+"\s*$',
              'REPO = "https://github.com/lesbunny/lesbunny-stuff"',
              text,
          )
          if count != 1:
              raise SystemExit("Could not rebrand the release-notes repository URL")
          notes.write_text(text, encoding="utf-8")
          PY

      - name: Stamp development version and private build notes
        id: version
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from datetime import datetime, timezone
          from pathlib import Path

          props = Path("gradle.properties")
          text = props.read_text(encoding="utf-8")
          current = re.search(r"(?m)^version\s*=\s*(.+)$", text)
          if not current:
              raise SystemExit("Missing version in gradle.properties")
          base = current.group(1).strip().split("-dev.")[0]
          version = f"{base}-dev.{os.environ['UPSTREAM_SHA'][:8]}.1"
          replacements = {
              "version": version,
              "releaseTag": f"v{version}",
              "releaseAsset": f"patches-{version}.mpp",
          }
          for key, value in replacements.items():
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"
              if re.search(pattern, text):
                  text = re.sub(pattern, f"{key} = {value}", text)
              else:
                  text += f"\n{key} = {value}\n"
          props.write_text(text, encoding="utf-8")

          bootstrap = Path("patches/src/main/resources/venus/bootstrap.js")
          source = bootstrap.read_text(encoding="utf-8")
          source, count = re.subn(r'(const revision\s*=\s*")[^"]+(")', rf'\g<1>{version}\2', source, count=1)
          if count != 1:
              raise SystemExit("Could not update runtime revision")
          bootstrap.write_text(source, encoding="utf-8")

          date = datetime.now(timezone.utc).date().isoformat()
          tag = f"v{version}"
          changelog = (
              f"## [{version}](https://github.com/lesbunny/lesbunny-stuff/compare/v{base}...{tag}) ({date})\n\n"
              "### 🔧 Improvements\n\n"
              "* **Discord:** Latest development snapshot\n"
          )
          Path("CHANGELOG.md").write_text(changelog, encoding="utf-8")
          print(f"version={version}")
          print(f"tag={tag}")
          print(f"asset=patches-{version}.mpp")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"asset=patches-{version}.mpp\n")
          PY

      - name: Cache pinned build toolchains
        uses: actions/cache@v4
        with:
          path: work/tools
          key: lesbunny-tools-hbc98-v1-${{ hashFiles('scripts/build.py') }}

      - name: Set up Node.js and Java 21
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Morphe bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py
          python3 scripts/build.py --metadata-only
          python3 scripts/build.py --check-metadata
          python3 - <<'PY'
          from pathlib import Path
          import re
          old_brand = bytes([86, 101, 110, 117, 115]).decode("ascii")
          p = Path("patches-list.json")
          if p.exists():
              p.write_text(re.sub(rf"\b{re.escape(old_brand)}\b", "lesbunny", p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          VERSION="${{ steps.version.outputs.version }}"
          sed 's|/\*__FEATURES__\*/|globalThis.__venusFeatures|g' patches/build/bootstrap.js > patches/build/bootstrap.precompile.js
          if [ ! -x work/tools/hermesc ]; then
            mkdir -p work/tools
            curl -fsSL "https://registry.npmjs.org/hermes-compiler/-/hermes-compiler-250829098.0.19.tgz" -o work/tools/hermes-compiler.tgz
            echo "839af099f0926b5ebbd738ba54764a3f40e35dfc3aac91babf56f8eb7c69280e  work/tools/hermes-compiler.tgz" | sha256sum -c -
            tar -xzf work/tools/hermes-compiler.tgz -C work/tools --strip-components=3 package/hermesc/linux64-bin/hermesc
            chmod +x work/tools/hermesc
          fi
          work/tools/hermesc -emit-binary -O -g0 -w -out=patches/build/bootstrap.hbc patches/build/bootstrap.precompile.js

      - name: Keep blank About-menu changelog target
        shell: bash
        run: |
          set -euo pipefail
          rm -f README.md AGENTS.md
          : > CHANGELOG.md

      - name: Commit synchronized source and metadata
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync: development snapshot $VERSION"
            git push origin HEAD:main
          fi

      - name: Publish Morphe bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; nothing new to publish."
            exit 0
          fi
          git tag -f "$TAG" HEAD
          git push origin "refs/tags/$TAG" --force
          gh release create "$TAG" "patches/build/libs/$ASSET" --title "$VERSION" --notes "Development snapshot."
