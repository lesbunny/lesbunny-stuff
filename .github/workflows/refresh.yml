name: lesbunny-stuff auto-updater

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-source
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Build and publish lesbunny patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stable release and development updates
        id: upstream
        shell: bash
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' 'VmVudXNJc0phZGVk' | base64 -d)"
          REPO="$(printf '%s' 'VmVudXMtUGF0Y2hlcw==' | base64 -d)"
          STATE_FILE=".github/upstream-state"

          RELEASE_JSON=""
          if RELEASE_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OWNER/$REPO/releases/latest")"; then
            STABLE_TAG="$(jq -r '.tag_name // empty' <<<"$RELEASE_JSON")"
          else
            STABLE_TAG=""
          fi

          if [ -f "$STATE_FILE" ] && jq -e 'type == "object"' "$STATE_FILE" >/dev/null 2>&1; then
            STATE_JSON="$(cat "$STATE_FILE")"
          else
            LEGACY_SHA=""
            if [ -f "$STATE_FILE" ]; then
              LEGACY_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
            fi
            if [ -n "$LEGACY_SHA" ]; then
              STATE_JSON="$(jq -n --arg sha "$LEGACY_SHA" --arg built_at "2026-11-01T11:30:52Z" '{development:{sha:$sha,built_at:$built_at}}')"
            else
              STATE_JSON='{}'
            fi
          fi

          LAST_STABLE_TAG="$(jq -r '.stable_tag // empty' <<<"$STATE_JSON")"
          LAST_DEV_SHA="$(jq -r '.development.sha // empty' <<<"$STATE_JSON")"
          LAST_DEV_BUILT_AT="$(jq -r '.development.built_at // empty' <<<"$STATE_JSON")"

          MODE="skip"
          CHANGED="false"
          BRANCH=""
          SHA=""
          PR_NUMBER="none"

          if [ -n "$STABLE_TAG" ] && [ "$STABLE_TAG" != "$LAST_STABLE_TAG" ]; then
            MODE="stable"
            BRANCH="$STABLE_TAG"
            TAG_SHA="$(git ls-remote "https://github.com/$OWNER/$REPO.git" "refs/tags/$STABLE_TAG^{}" "refs/tags/$STABLE_TAG" | awk -v tag="refs/tags/$STABLE_TAG" '$2 == tag "^{}" { peeled = $1 } $2 == tag { direct = $1 } END { if (peeled != "") print peeled; else print direct }')"
            if [ -z "$TAG_SHA" ]; then
              echo "Could not resolve upstream release tag $STABLE_TAG"
              exit 1
            fi
            SHA="$TAG_SHA"
            CHANGED="true"
            mkdir -p .git
            jq -r '.body // ""' <<<"$RELEASE_JSON" > .git/upstream-release-notes.md
            echo "New stable release detected: $STABLE_TAG ($SHA)"
          else
            API_URL="https://api.github.com/repos/$OWNER/$REPO/pulls?state=open&per_page=100"
            PR_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' "$API_URL")"
            PR="$(jq -cer --arg owner "$OWNER" --arg repo "$REPO" '[.[] | select(.user.login == $owner and .head.repo.full_name == ($owner + "/" + $repo))] | sort_by(.updated_at) | last' <<<"$PR_JSON" || true)"
            if [ -n "$PR" ] && [ "$PR" != "null" ]; then
              BRANCH="$(jq -r '.head.ref' <<<"$PR")"
              SHA="$(jq -r '.head.sha' <<<"$PR")"
              PR_NUMBER="$(jq -r '.number' <<<"$PR")"
            else
              BRANCH="main"
              SHA="$(curl -fsSL "https://api.github.com/repos/$OWNER/$REPO/branches/main" | jq -r '.commit.sha')"
            fi

            LAST_DEV_TS=0
            if [ -n "$LAST_DEV_BUILT_AT" ]; then
              LAST_DEV_TS="$(date -u -d "$LAST_DEV_BUILT_AT" +%s 2>/dev/null || echo 0)"
            fi
            NOW_TS="$(date -u +%s)"
            ELAPSED="$((NOW_TS - LAST_DEV_TS))"

            if [ "$SHA" != "$LAST_DEV_SHA" ] && [ "$ELAPSED" -ge 172800 ]; then
              MODE="development"
              CHANGED="true"
              echo "Development snapshot is due and changed: ${LAST_DEV_SHA:-<none>} -> $SHA"
            elif [ "$SHA" = "$LAST_DEV_SHA" ]; then
              echo "Development source is unchanged at $SHA; skipping."
            else
              echo "Development source changed, but its 48-hour build interval has not elapsed (${ELAPSED}s)."
            fi
          fi

          {
            echo "owner=$OWNER"
            echo "repo=$REPO"
            echo "branch=$BRANCH"
            echo "sha=$SHA"
            echo "pr_number=$PR_NUMBER"
            echo "mode=$MODE"
            echo "changed=$CHANGED"
          } >> "$GITHUB_OUTPUT"

      - name: Mirror selected upstream release or development source
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_OWNER: \${{ steps.upstream.outputs.owner }}
          UPSTREAM_REPO: \${{ steps.upstream.outputs.repo }}
          UPSTREAM_BRANCH: \${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: \${{ steps.upstream.outputs.sha }}
          UPSTREAM_MODE: \${{ steps.upstream.outputs.mode }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --depth 1 --single-branch --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git" "$TMP/source"
          ACTUAL_SHA="$(git -C "$TMP/source" rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$UPSTREAM_SHA"
          RSYNC_ARGS=(-a --delete
            --exclude='.git/'
            --exclude='.github/workflows/refresh.yml'
            --exclude='.github/upstream-state'
          )
          if [ "$UPSTREAM_MODE" = "development" ]; then
            RSYNC_ARGS+=(--exclude='CHANGELOG.md')
          fi
          rsync "\${RSYNC_ARGS[@]}" "$TMP/source/" "$GITHUB_WORKSPACE/"

      - name: Remove public documentation and preserve legal notices
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          find . -type f -iname '*.md' -not -path './.git/*' -not -name 'CHANGELOG.md' -delete
          rm -f .github/workflows/build.yml
          rm -rf .github/ISSUE_TEMPLATE .github/dependabot.yml
          mkdir -p .github/workflows
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          notice = Path("NOTICE")
          original = notice.read_text(encoding="utf-8") if notice.exists() else ""
          marker = "Modified work notice"
          if not original.startswith(marker):
              header = (
                  "Modified work notice\n"
                  f"Modified by lesbunny on {datetime.now(timezone.utc).date().isoformat()} (UTC). "
                  "This is a modified version; upstream copyright and third-party attribution notices are retained below.\n\n"
              )
              notice.write_text(header + original, encoding="utf-8")
          PY

      - name: Rebrand visible labels and bundle metadata
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_OWNER: ${{ steps.upstream.outputs.owner }}
          UPSTREAM_REPO: ${{ steps.upstream.outputs.repo }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          upstream_brand = bytes([86, 101, 110, 117, 115]).decode("ascii")
          targets = []
          targets += list(Path("patches/src/main/resources/venus").glob("bootstrap.js"))
          targets += list(Path("patches/src/main/resources/venus/i18n").glob("*.json"))
          targets += list(Path("patches/src/main/kotlin").rglob("*.kt"))
          for path in targets:
              text = path.read_text(encoding="utf-8")
              text = re.sub(rf"\b{re.escape(upstream_brand)}\b", "lesbunny", text)
              text = text.replace("com.discord.venus", "com.discord.lesbunny")
              if path.name == "BrandingPatches.kt":
                  text, count = re.subn(
                      r'(key = "appName",\s*default = )"[^"]+"',
                      r'\1"Discord"',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit("Could not set the default Discord app name")
              path.write_text(text, encoding="utf-8")

          bootstrap = Path("patches/src/main/resources/venus/bootstrap.js")
          text = bootstrap.read_text(encoding="utf-8")
          text, count = re.subn(
              r'const REPO = "[^"]+";',
              'const REPO = "https://github.com/lesbunny/lesbunny-stuff";',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not rebrand the About-menu repository URL")
          text = text.replace('DEBUG_LOG_FILE = "venus-log.txt"', 'DEBUG_LOG_FILE = "lesbunny-log.txt"')
          text = re.sub(r'(dlog\("[A-Z]",\s*)"venus"(?=\s*,)', r'\1"lesbunny"', text)
          text = text.replace('" I [venus] Debug logging off"', '" I [lesbunny] Debug logging off"')
          text = text.replace('"venus-logs-"', '"lesbunny-logs-"')
          text = text.replace('"venus-backup-"', '"lesbunny-backup-"')
          bootstrap.write_text(text, encoding="utf-8")

          upstream_repo_url = f"https://github.com/{os.environ['UPSTREAM_OWNER']}/{os.environ['UPSTREAM_REPO']}"
          for path in Path("scripts").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(upstream_repo_url, "https://github.com/lesbunny/lesbunny-stuff")
              text = re.sub(rf"\b{re.escape(upstream_brand)}\b", "lesbunny", text)
              path.write_text(text, encoding="utf-8")
          cli = Path("scripts/morphe_cli.py")
          text = cli.read_text(encoding="utf-8").replace('"User-Agent": "venus-patches"', '"User-Agent": "lesbunny-patches"')
          cli.write_text(text, encoding="utf-8")

          for language_file in Path("patches/src/main/resources/venus/i18n").glob("*.json"):
              data = json.loads(language_file.read_text(encoding="utf-8"))
              strings = data.get("strings")
              if isinstance(strings, dict):
                  strings.setdefault("lesbunny", "lesbunny")
                  language_file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          build = Path("scripts/build.py")
          text = build.read_text(encoding="utf-8")
          text = re.sub(r'Name: [^"]+', "Name: Discord", text)
          text = re.sub(r'Description: [^"]+', "Description: Discord patches by lesbunny.", text)
          text = re.sub(r'Source: https://github\.com/[^"]+', "Source: https://github.com/lesbunny/lesbunny-stuff", text)
          text = re.sub(r'Author: [^"]+', "Author: lesbunny", text)
          build.write_text(text, encoding="utf-8")

          notes = Path("scripts/release_notes.py")
          text = notes.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^REPO\s*=\s*"[^"]+"\s*

      - name: Stamp stable or development version and release notes
        if: steps.upstream.outputs.changed == 'true'
        id: version
        shell: bash
        env:
          UPSTREAM_SHA: \${{ steps.upstream.outputs.sha }}
          UPSTREAM_MODE: \${{ steps.upstream.outputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from datetime import datetime, timezone
          from pathlib import Path

          props = Path("gradle.properties")
          text = props.read_text(encoding="utf-8")
          current = re.search(r"(?m)^version\s*=\s*(.+)$", text)
          if not current:
              raise SystemExit("Missing version in gradle.properties")
          base = current.group(1).strip().split("-dev.")[0]
          if os.environ["UPSTREAM_MODE"] == "stable":
              version = base
          else:
              version = f"{base}-dev.{os.environ['UPSTREAM_SHA'][:8]}.4"
          replacements = {
              "version": version,
              "releaseTag": f"v{version}",
              "releaseAsset": f"patches-{version}.mpp",
          }
          for key, value in replacements.items():
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"
              if re.search(pattern, text):
                  text = re.sub(pattern, f"{key} = {value}", text)
              else:
                  text += f"\n{key} = {value}\n"
          props.write_text(text, encoding="utf-8")

          bootstrap = Path("patches/src/main/resources/venus/bootstrap.js")
          source = bootstrap.read_text(encoding="utf-8")
          source, count = re.subn(r'(const revision\s*=\s*")[^"]+(")', rf'\g<1>{version}\2', source, count=1)
          if count != 1:
              raise SystemExit("Could not update runtime revision")
          bootstrap.write_text(source, encoding="utf-8")

          if os.environ["UPSTREAM_MODE"] == "development":
              date = datetime.now(timezone.utc).date().isoformat()
              tag = f"v{version}"
              changelog = (
                  f"## [{version}](https://github.com/lesbunny/lesbunny-stuff/compare/v{base}...{tag}) ({date})\n\n"
                  "### 🔧 Improvements\n\n"
                  "* **Discord:** Latest development snapshot\n"
              )
              changelog_path = Path("CHANGELOG.md")
              previous = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""
              if not previous.startswith(f"## [{version}]("):
                  changelog_path.write_text(changelog + ("\n" + previous if previous.strip() else ""), encoding="utf-8")
          else:
              changelog_path = Path("CHANGELOG.md")
              if not changelog_path.exists() or not changelog_path.read_text(encoding="utf-8").startswith(f"## [{version}]("):
                  raise SystemExit(f"Stable upstream changelog does not start with version {version}")

          print(f"version={version}")
          print(f"tag=v{version}")
          print(f"asset=patches-{version}.mpp")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
              output.write(f"asset=patches-{version}.mpp\n")
          PY

      - name: Cache pinned build toolchains
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: work/tools
          key: lesbunny-tools-hbc98-v1-${{ hashFiles('scripts/build.py') }}

      - name: Set up Node.js and Java 21
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        if: steps.upstream.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Morphe bundle
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py
          python3 scripts/build.py --metadata-only
          python3 scripts/build.py --check-metadata
          python3 - <<'PY'
          from pathlib import Path
          import re
          old_brand = bytes([86, 101, 110, 117, 115]).decode("ascii")
          p = Path("patches-list.json")
          if p.exists():
              p.write_text(re.sub(rf"\b{re.escape(old_brand)}\b", "lesbunny", p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          source = Path("patches/src/main/kotlin/app/venus/patches/DiscordPatches.kt").read_text(encoding="utf-8")
          match = re.search(
              r'internal val discord = Compatibility\([\s\S]*?targets = listOf\(AppTarget\(\s*version = "([^"]+)",\s*versionCode = (\d+)',
              source,
          )
          if not match:
              raise SystemExit("Could not read Discord AppTarget from upstream source")
          expected_version, expected_code = match.group(1), int(match.group(2))

          index = json.loads(Path("patches-list.json").read_text(encoding="utf-8"))
          targets = [
              target
              for patch in index.get("patches", [])
              for app in patch.get("compatiblePackages", [])
              if app.get("packageName") == "com.discord"
              for target in app.get("targets", [])
          ]
          if not targets:
              raise SystemExit("Generated patch list has no Discord compatibility target")
          for target in targets:
              codes = set((target.get("versionCodes") or {}).values())
              if target.get("version") != expected_version or codes != {expected_code}:
                  raise SystemExit(
                      f"Discord target mismatch: upstream={expected_version}/{expected_code}, "
                      f"generated={target.get('version')}/{sorted(codes)}"
                  )
          print(f"Discord compatibility verified: {expected_version} (versionCode {expected_code})")
          PY
          VERSION="${{ steps.version.outputs.version }}"
          sed 's|/\*__FEATURES__\*/|globalThis.__venusFeatures|g' patches/build/bootstrap.js > patches/build/bootstrap.precompile.js
          if [ ! -x work/tools/hermesc ]; then
            mkdir -p work/tools
            curl -fsSL "https://registry.npmjs.org/hermes-compiler/-/hermes-compiler-250829098.0.19.tgz" -o work/tools/hermes-compiler.tgz
            echo "839af099f0926b5ebbd738ba54764a3f40e35dfc3aac91babf56f8eb7c69280e  work/tools/hermes-compiler.tgz" | sha256sum -c -
            tar -xzf work/tools/hermes-compiler.tgz -C work/tools --strip-components=3 package/hermesc/linux64-bin/hermesc
            chmod +x work/tools/hermesc
          fi
          work/tools/hermesc -emit-binary -O -g0 -w -out=patches/build/bootstrap.hbc patches/build/bootstrap.precompile.js

      - name: Keep Morphe changelog and remove other public docs
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f README.md AGENTS.md

      - name: Commit synchronized source and metadata
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_MODE: \${{ steps.upstream.outputs.mode }}
          VERSION: \${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$UPSTREAM_MODE" = "stable" ]; then
              MESSAGE="sync: stable release $VERSION"
            else
              MESSAGE="sync: development snapshot $VERSION"
            fi
            git commit -m "$MESSAGE"
            git push origin HEAD:main
          fi

      - name: Publish Morphe bundle release
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          VERSION: \${{ steps.version.outputs.version }}
          TAG: \${{ steps.version.outputs.tag }}
          ASSET: \${{ steps.version.outputs.asset }}
          UPSTREAM_MODE: \${{ steps.upstream.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; nothing new to publish."
          else
            git tag -f "$TAG" HEAD
            git push origin "refs/tags/$TAG" --force
            if [ "$UPSTREAM_MODE" = "stable" ] && [ -s .git/upstream-release-notes.md ]; then
              gh release create "$TAG" "patches/build/libs/$ASSET" --title "$VERSION" --notes-file .git/upstream-release-notes.md
            elif [ "$UPSTREAM_MODE" = "stable" ]; then
              gh release create "$TAG" "patches/build/libs/$ASSET" --title "$VERSION" --notes "Stable release."
            else
              gh release create "$TAG" "patches/build/libs/$ASSET" --title "$VERSION" --notes "Development snapshot."
            fi
          fi

      - name: Record successfully published upstream state
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_MODE: \${{ steps.upstream.outputs.mode }}
          UPSTREAM_SHA: \${{ steps.upstream.outputs.sha }}
          UPSTREAM_REF: \${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(".github/upstream-state")
          try:
              state = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(state, dict):
                  state = {}
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}

          if "development" not in state and path.exists():
              old_sha = path.read_text(encoding="utf-8").strip()
              if old_sha and len(old_sha) >= 7:
                  state["development"] = {
                      "sha": old_sha,
                      "built_at": "2026-11-01T11:30:52Z",
                  }

          if os.environ["UPSTREAM_MODE"] == "stable":
              state["stable_tag"] = os.environ["UPSTREAM_REF"]
          else:
              state["development"] = {
                  "sha": os.environ["UPSTREAM_SHA"],
                  "built_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              }

          path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-state
          if ! git diff --cached --quiet; then
            git commit -m "chore: record successful upstream state"
            git push origin HEAD:main
          fi
